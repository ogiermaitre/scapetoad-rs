[workspace]
resolver = "2"
members = ["crates/scapetoad", "crates/scapetoad-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
repository = "https://github.com/christiankaiser/ScapeToad"

[workspace.dependencies]
scapetoad = { path = "crates/scapetoad" }
geo = "0.33"
geo-types = "0.7"
rustdct = "0.7"
rayon = "1.12"
thiserror = "2"
shapefile = "0.9"
geojson = "1"
flatgeobuf = "6"
geozero = "0.15"
# GDAL 3.13 support (georust/gdal#714) is merged but not released yet (0.19.0 is the
# latest on crates.io). Go back to a crates.io version once 0.20 is out.
gdal = { git = "https://github.com/georust/gdal", rev = "c0a6266b987a2c2d44aea9956c2cae1ed71445cf" }
# preserve_order keeps attribute column order; float_roundtrip reads coordinates back exactly.
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
clap = { version = "4.6", features = ["derive"] }
anyhow = "1"

[profile.release]
debug = 1
